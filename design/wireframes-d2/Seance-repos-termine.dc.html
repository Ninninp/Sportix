    .lbl { font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: #b5b5b0; }

        <span class="muted" style="font-size: 13px;">objectif <span class="num" style="font-weight: 700; color: #ffffff;">4–6</span> reps</span>

    </div>
  </main>

</div>
