<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" role="img" aria-label="Icône Sportix">
  <!-- Fond carré : iOS arrondit lui-même les coins de l'icône. -->
  <rect width="1024" height="1024" fill="#1A1030"></rect>
  <!-- Disque de fonte vu de face -->
  <circle cx="512" cy="512" r="340" fill="#FF4B1F"></circle>
  <!-- Rainure intérieure -->
  <circle cx="512" cy="512" r="262" fill="none" stroke="#1A1030" stroke-width="20"></circle>
  <!-- Trois poignées, à 120° les unes des autres -->
  <g fill="#1A1030">
    <rect x="442" y="262" width="140" height="64" rx="32"></rect>
    <rect x="442" y="262" width="140" height="64" rx="32" transform="rotate(120 512 512)"></rect>
    <rect x="442" y="262" width="140" height="64" rx="32" transform="rotate(240 512 512)"></rect>
  </g>
  <!-- Trou central -->
  <circle cx="512" cy="512" r="72" fill="#1A1030"></circle>
</svg>
